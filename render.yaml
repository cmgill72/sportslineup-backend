services:
  - type: web
    name: sportslineup-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Never overwrite an API key already entered under Render > Environment.
      # For existing Blueprints, sync:false is ignored on later syncs;
      # the actual key must be maintained in the Render Dashboard.
      - key: SPORTSDB_API_KEY
        sync: false
      # Supplemental sources disabled until you explicitly approve exploratory use.
      # Confirm permitted usage and distribution terms with each provider.
      - key: SPORTSLINEUP_ENABLE_MLB
        value: "false"
      - key: SPORTSLINEUP_ENABLE_NHL
        value: "false"
      - key: SPORTSLINEUP_ENABLE_ESPN
        value: "false"

      # v0.6: gated Gracenote OnConnect integration (commercial contract required).
      - key: SPORTSLINEUP_ENABLE_GRACENOTE
        sync: false
      - key: GRACENOTE_API_KEY
        sync: false

      # Team-badge artwork is opt-in; set it in Render Dashboard.
      # Do not overwrite an existing preference during deploy.
      # v0.7 premium score feed.
      - key: SPORTSLINEUP_ENABLE_LIVE_SCORES
        value: "true"
      - key: SPORTSLINEUP_ENABLE_TEAM_BADGES
        sync: false

      # Curated network thumbnail registry. Preview is for internal testing only;
      # set to licensed before App Store distribution, after rights review.
      - key: SPORTSLINEUP_NETWORK_LOGO_MODE
        value: "preview"
      # Optional managed HTTPS JSON manifest URL for updates after launch.
      - key: SPORTSLINEUP_NETWORK_LOGO_MANIFEST_URL
        sync: false
